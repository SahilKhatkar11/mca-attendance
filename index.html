<!DOCTYPE html>
<html>
<head>
  <title>Class Attendance</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e3f2fd, #fce4ec);
      --text-color: #222;
      --present-color: #4CAF50;
      --absent-color: #f44336;
    }

    body.dark {
      --bg-gradient: linear-gradient(135deg, #1e1e2f, #2c2c3c);
      --text-color: black;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      transition: 0.3s;
    }

    .container {
      background: linear-gradient(-13deg, linen, #fafce7, #c6e6f5);
      color: var(--text-color);
      padding: 25px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 720px;
      max-width: 95%;
    }

    /* ===== University Header ===== */
    .university-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 12px;
    }

    .uni-logo {
      width: 90px;
      height: auto;
    }

    .uni-text h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .uni-text h2 {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 600;
    }

    /* ===== Top Bar (Program + Toggle) ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 12px;
    }

    .program-title {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }

    .toggle-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: #333;
      color: white;
      font-size: 12px;
    }

    /* ===== Student List ===== */
    #studentListContainer {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    #studentList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
    }

    #studentList div {
      background: rgba(245, 245, 245, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    #studentList div:hover {
      background: rgba(220, 220, 220, 0.9);
    }

    #studentList input {
      margin-right: 10px;
      pointer-events: none;
    }

    .done-btn {
      background: #2196F3;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      margin: 15px auto;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      color: white;
      font-size: 12px;
      margin-left: 8px;
    }

    .present-badge { background: var(--present-color); }
    .absent-badge { background: var(--absent-color); }

    textarea {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 13px;
      margin-top: 5px;
      overflow: hidden; /* NO SCROLL */
    }

    .copy-btn {
      margin-top: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #555;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* ===== Footer ===== */
    .footer-box {
      margin-top: 30px;
      padding: 12px;
      text-align: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      font-size: 14px;
      font-weight: 600;
    }

    .footer-box a {
      color: #1a73e8;
      text-decoration: none;
    }

/* ===== Footer Glass + Lift Hover Effect ===== */
.footer-box {
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.footer-box:hover {
  transform: translateY(-6px); /* lift up */
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

.footer-box::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 120%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255, 255, 255, 0.6),
    transparent
  );
  transition: all 0.6s ease;
}

.footer-box:hover::before {
  left: 120%;
}

/* ===== Generate Attendance Click Effect ===== */
.done-btn {
  transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.done-btn:active {
  background-color: #1976D2; /* darker blue */
  transform: translateY(2px); /* pressed down */
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

  </style>
</head>

<body>
<div class="container">

  <!-- University Header -->
  <div class="university-header">
    <img src="https://i.ibb.co/Lzsqy7Rf/cdlu-logo.png" alt="CDLU Logo" class="uni-logo">
    <div class="uni-text">
      <h1>CHAUDHARY DEVILAL UNIVERSITY, SIRSA</h1>
      <h2>Department of Computer Science & Engineering</h2>
    </div>
  </div>

  <!-- Program + Toggle (same line) -->
  <div class="top-bar">
    <div class="program-title">
      Master of Computer Applications (2024-26)
    </div>
    <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark</button>
  </div>

  <!-- Student List -->
  <div id="studentListContainer">
    <div id="studentList"></div>
  </div>

  <button class="done-btn" onclick="generateAttendance()">Generate Attendance</button>

  <div>
    <h3>Present <span id="presentCount" class="badge present-badge">0</span></h3>
    <textarea id="presentField" readonly></textarea>
  </div>

  <div>
    <h3>Absent <span id="absentCount" class="badge absent-badge">0</span></h3>
    <textarea id="absentField" readonly></textarea>
  </div>

  <div style="margin-top:15px;">
    <h3>Ready Message</h3>
    <textarea id="finalMessage" readonly></textarea>
    <button class="copy-btn" onclick="copyText('finalMessage')">Copy Message</button>
  </div>

  <!-- Footer -->
  <div class="footer-box">
    Designed by 
    <a href="https://github.com/SahilKhatkar11" target="_blank">
      Sahil Khatkar
    </a>
  </div>

</div>

<script>
  const students = [
    { roll: 1, name: "Alisha Devi" }, { roll: 2, name: "Kirandeep Kaur" },
    { roll: 3, name: "Aarzoo" }, { roll: 4, name: "Poonam Rani" },
    { roll: 5, name: "Pankaj Kumar" }, { roll: 6, name: "Nisha Rani" },
    { roll: 7, name: "Pooja Rani" }, { roll: 8, name: "Kavita" },
    { roll: 9, name: "Manju" }, { roll: 10, name: "Ashish" },
    { roll: 11, name: "Narender" }, { roll: 12, name: "Manisha" },
    { roll: 13, name: "Sourav Shah" }, { roll: 14, name: "Vikram" },
    { roll: 15, name: "Soniya" }, { roll: 16, name: "Sunita Rani" },
    { roll: 17, name: "Jaspreet Singh" }, { roll: 19, name: "Yogesh" },
    { roll: 20, name: "Ankush" }, { roll: 21, name: "Gaurav" },
    { roll: 23, name: "Tanu" }, { roll: 24, name: "Anu" },
    { roll: 25, name: "Vinod Kumar" }, { roll: 26, name: "Kiranpal Kaur" },
    { roll: 27, name: "Vaspreet Kaur" }, { roll: 28, name: "Sanjeevan Singh" },
    { roll: 29, name: "Jyoti" }, { roll: 31, name: "Hemant" },
    { roll: 32, name: "Shivam Mehta" }, { roll: 33, name: "Sahil Khatkar" },
    { roll: 34, name: "Nishu Sharma Bhardwaj" }, { roll: 35, name: "Sayra Soni" }
  ];

  const list = document.getElementById("studentList");
  students.forEach(s => {
    const d = document.createElement("div");
    d.innerHTML = `<input type="checkbox" id="s${s.roll}"> ${s.roll} - ${s.name}`;
    d.onclick = () => document.getElementById(`s${s.roll}`).checked ^= true;
    list.appendChild(d);
  });

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function generateAttendance() {
    let p=[], a=[];
    students.forEach(s =>
      document.getElementById(`s${s.roll}`).checked ? p.push(s.roll) : a.push(s.roll)
    );

    presentField.value = `Present (${p.length}): ${p.join(", ")}`;
    absentField.value = `Absent (${a.length}): ${a.join(", ")}`;
    finalMessage.value = presentField.value + "\n" + absentField.value;

    presentCount.innerText = p.length;
    absentCount.innerText = a.length;

    [presentField, absentField, finalMessage].forEach(autoResize);
  }

  function copyText(id){
    document.getElementById(id).select();
    document.execCommand("copy");
    alert("Copied!");
  }

  function toggleDarkMode(){
    document.body.classList.toggle("dark");
  }
</script>

</body>
</html>
